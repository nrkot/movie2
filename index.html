<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Five Nights at Freddy's</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        background: #000;
    }

    .sidebar {
        width: 250px;
        background: #111;
        color: white;
        height: 100vh;
        padding: 20px;
        position: fixed;
        left: 0;
        top: 0;
    }

    .sidebar h2 {
        margin-bottom: 20px;
    }

    .sidebar a {
        display: block;
        color: white;
        padding: 10px 0;
        text-decoration: none;
        transition: 0.3s;
    }

    .sidebar a:hover {
        color: #5200bd;
    }

    .main {
        margin-left: 250px;
        width: calc(100% - 250px);
        overflow-x: hidden;
    }

    .hero {
        background-image: url('https://dx35vtwkllhj9.cloudfront.net/universalstudios/five-nights-at-freddys-2/images/regions/us/tt.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        position: relative;
    }

    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
    }

    .content {
        position: relative;
        z-index: 2;
        color: white;
        text-align: center;
        top: 50%;
        transform: translateY(-50%);
    }

    .logo {
        max-width: 300px;
        margin-bottom: 20px;
        animation: fadeIn 2s ease-out;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 20px;
        animation: fadeIn 2.5s ease-out;
    }

    .trailer-btn {
        display: inline-block;
        padding: 12px 24px;
        color: #fff;
        border: 2px solid #fff;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
        animation: fadeIn 3s ease-out;
    }

    .trailer-btn:hover {
        background: #fff;
        color: #000;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0,0,0,0.8);
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        position: relative;
        width: 80%;
        max-width: 800px;
        background: #000;
        padding: 0;
        border-radius: 8px;
        overflow: hidden;
    }

    .video-container {
        position: relative;
        padding-top: 56.25%;
        height: 0;
    }

    .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .close {
        position: absolute;
        top: 10px;
        right: 20px;
        font-size: 30px;
        color: #fff;
        cursor: pointer;
        z-index: 10;
    }
  </style>
</head>
<body>
    <div class="sidebar">
        <h2>Меню</h2>
        <a href="https://nrkot.github.io/index-fnafuv-/">Главная</a>
        <a href="https://nrkot.github.io/movie/">сайт о первом фильме</a>
        <a href="https://www.instagram.com/fnafmovie/">инстаграм</a>
    </div>

    <div class="main">
        <div class="hero" id="home">
            <div class="overlay"></div>
            <div class="content">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsp5gtmVVcU5e6XRwE0TxbeG0VnmVkVHZQhw&s" alt="FNAF Logo" class="logo"/>
                <h1>Five Nights at Freddy's movie 2 (2025)</h1>
                <a href="#" class="trailer-btn" id="openModal">WATCH TEASER</a>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/eGV7zwjvxKs?si=t81CiZDdbKGlBNXg" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const openBtn = document.getElementById('openModal');
        const closeBtn = document.getElementById('closeModal');

        openBtn.addEventListener('click', (e) => {
            e.preventDefault();
            modal.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            const iframe = modal.querySelector('iframe');
            iframe.src = iframe.src;
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                const iframe = modal.querySelector('iframe');
                iframe.src = iframe.src;
            }
        });
    </script>
</body>
</html>
